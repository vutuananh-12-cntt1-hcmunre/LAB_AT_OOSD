<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trả sách</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="/" class="navbar-brand">
            Quản lý thư viện
        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                Trả sách
            </h4>

        </div>


        <div class="card-body">

            <div th:if="${loi}"
                 class="alert alert-danger"
                 th:text="${loi}">

            </div>


            <form action="/muontra/tra"
                  method="post">


                <input type="hidden"
                       name="maChiTiet"
                       th:value="${maChiTiet}">

                <input type="hidden"
                       name="maPhieuMuon"
                       th:value="${maPhieuMuon}">


                <!-- Ngày trả -->

                <div class="mb-3">

                    <label class="form-label">
                        Ngày trả
                    </label>

                    <input type="date"
                           name="ngayTra"
                           class="form-control"
                           th:value="${ngayTra}"
                           required>

                </div>


                <!-- Tiền phạt -->

                <div class="mb-3">

                    <label class="form-label">
                        Tiền phạt
                    </label>

                    <input type="number"
                           name="tienPhat"
                           class="form-control"
                           step="0.01"
                           min="0"
                           th:value="${tienPhat != null ? tienPhat : 0}">

                </div>


                <!-- Ghi chú -->

                <div class="mb-3">

                    <label class="form-label">
                        Ghi chú / lý do phạt
                    </label>

                    <textarea name="ghiChu"
                              class="form-control"
                              rows="4"
                              th:text="${ghiChu}"></textarea>

                </div>


                <button type="submit"
                        class="btn btn-success">

                    Xác nhận trả sách

                </button>


                <a th:href="@{/muontra/chitiet/{id}(id=${maPhieuMuon})}"
                   class="btn btn-secondary">

                    Hủy

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
