<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chi tiết phiếu mượn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="/" class="navbar-brand">
            Quản lý thư viện
        </a>

    </div>

</nav>


<div class="container mt-4">

    <h2>
        Chi tiết phiếu mượn
    </h2>


    <div class="card mb-4">

        <div class="card-body">

            <p>
                <strong>Mã phiếu:</strong>
                <span th:text="${phieuMuon.maPhieuMuon}">
                    PM001
                </span>
            </p>

            <p>
                <strong>Độc giả:</strong>
                <span th:text="${phieuMuon.docGia.hoTen}">
                    Lê Văn C
                </span>
            </p>

            <p>
                <strong>Nhân viên:</strong>
                <span th:text="${phieuMuon.nhanVien.ho + ' ' + phieuMuon.nhanVien.ten}">
                    Nguyễn Văn A
                </span>
            </p>

            <p>
                <strong>Ngày mượn:</strong>
                <span th:text="${phieuMuon.ngayMuon}">
                    2026-09-18
                </span>
            </p>

            <p>
                <strong>Ngày hẹn trả:</strong>
                <span th:text="${phieuMuon.ngayHenTra}">
                    2026-09-25
                </span>
            </p>

        </div>

    </div>


    <h4>
        Danh sách sách
    </h4>


    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-primary">

            <tr>

                <th>Mã chi tiết</th>

                <th>Mã sách</th>

                <th>Tên sách</th>

                <th>Ngày trả</th>

                <th>Tiền phạt</th>

                <th>Ghi chú</th>

                <th>Thao tác</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="ct : ${danhSachChiTiet}">

                <td th:text="${ct.maChiTiet}">
                    PM001-CT1
                </td>

                <td th:text="${ct.dauSach.maDauSach}">
                    S001
                </td>

                <td th:text="${ct.dauSach.tenSach}">
                    Lập trình Java căn bản
                </td>

                <td th:text="${ct.ngayTra}">
                    -
                </td>

                <td th:text="${ct.tienPhat}">
                    0
                </td>

                <td th:text="${ct.ghiChu}">
                    -
                </td>

                <td>

                    <a th:if="${ct.ngayTra == null}"
                       class="btn btn-sm btn-success"
                       th:href="@{/muontra/tra/{id}(id=${ct.maChiTiet})}">

                        Trả sách

                    </a>

                    <span th:unless="${ct.ngayTra == null}"
                          class="badge bg-secondary">

                        Đã trả

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <a href="/muontra"
       class="btn btn-secondary">

        Quay lại

    </a>

</div>

</body>

</html>
