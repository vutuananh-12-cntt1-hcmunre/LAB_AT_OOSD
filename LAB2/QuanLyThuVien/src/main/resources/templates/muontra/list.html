<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý mượn trả</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="/" class="navbar-brand">
            Quản lý thư viện
        </a>

        <a href="/" class="btn btn-light">
            Trang chủ
        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Quản lý mượn trả</h2>

        <a href="/muontra/them"
           class="btn btn-primary">

            + Lập phiếu mượn

        </a>

    </div>


    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-primary">

            <tr>

                <th>Mã phiếu</th>

                <th>Độc giả</th>

                <th>Nhân viên</th>

                <th>Ngày mượn</th>

                <th>Ngày hẹn trả</th>

                <th>Thao tác</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="phieu : ${danhSachPhieuMuon}">

                <td th:text="${phieu.maPhieuMuon}">
                    PM001
                </td>

                <td th:text="${phieu.docGia.hoTen}">
                    Lê Văn C
                </td>

                <td th:text="${phieu.nhanVien.ho + ' ' + phieu.nhanVien.ten}">
                    Nguyễn Văn A
                </td>

                <td th:text="${phieu.ngayMuon}">
                    2026-09-18
                </td>

                <td th:text="${phieu.ngayHenTra}">
                    2026-09-25
                </td>

                <td>

                    <a class="btn btn-sm btn-info"
                       th:href="@{/muontra/chitiet/{id}(id=${phieu.maPhieuMuon})}">

                        Chi tiết

                    </a>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(danhSachPhieuMuon)}">

                <td colspan="6"
                    class="text-center">

                    Chưa có phiếu mượn.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
