<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${tieuDe}">
        Thêm thể loại
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2
        class="mb-4"
        th:text="${tieuDe}">
        Thêm thể loại
    </h2>

    <div
        th:if="${loi}"
        class="alert alert-danger"
        th:text="${loi}">
        Lỗi
    </div>

    <form
        th:action="@{/theloai/luu}"
        th:object="${theLoai}"
        method="post">

        <div class="mb-3">

            <label
                for="maTheLoai"
                class="form-label">

                Mã thể loại

            </label>

            <input
                type="text"
                id="maTheLoai"
                th:field="*{maTheLoai}"
                class="form-control"
                placeholder="Ví dụ: TL04"
                required>

        </div>

        <div class="mb-3">

            <label
                for="tenTheLoai"
                class="form-label">

                Tên thể loại

            </label>

            <input
                type="text"
                id="tenTheLoai"
                th:field="*{tenTheLoai}"
                class="form-control"
                placeholder="Nhập tên thể loại"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            Lưu

        </button>

        <a
            th:href="@{/theloai}"
            class="btn btn-secondary">

            Hủy

        </a>

    </form>

</div>

</body>

</html>
