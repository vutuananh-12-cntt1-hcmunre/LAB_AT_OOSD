<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý thể loại</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>
            Quản lý thể loại
        </h2>

        <a
            th:href="@{/theloai/them}"
            class="btn btn-primary">

            + Thêm thể loại

        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th style="width: 20%;">
                Mã thể loại
            </th>

            <th>
                Tên thể loại
            </th>

            <th style="width: 25%;">
                Thao tác
            </th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="theLoai : ${danhSachTheLoai}">

            <td th:text="${theLoai.maTheLoai}">
                TL01
            </td>

            <td th:text="${theLoai.tenTheLoai}">
                Công nghệ thông tin
            </td>

            <td>

                <a
                    th:href="@{/theloai/sua/{id}(id=${theLoai.maTheLoai})}"
                    class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <a
                    th:href="@{/theloai/xoa/{id}(id=${theLoai.maTheLoai})}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Bạn có chắc muốn xóa thể loại này không?');">

                    Xóa

                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(danhSachTheLoai)}">

            <td
                colspan="3"
                class="text-center">

                Chưa có dữ liệu.

            </td>

        </tr>

        </tbody>

    </table>

    <a
        href="/"
        class="btn btn-secondary">

        ← Về trang chủ

    </a>

</div>

</body>

</html>
