<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thống kê thư viện</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h2>Thống kê thư viện</h2>

        <a href="/"
           class="btn btn-secondary">
            Trang chủ
        </a>

    </div>


    <!-- ============================= -->
    <!-- THỐNG KÊ PHIẾU -->
    <!-- ============================= -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Tổng phiếu mượn</h5>

                    <h2 th:text="${tongSoPhieuMuon}">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Tổng sách đã mượn</h5>

                    <h2 th:text="${tongSoSachDaMuon}">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Sách đang mượn</h5>

                    <h2 th:text="${soSachDangMuon}">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- THỐNG KÊ TRẠNG THÁI -->
    <!-- ============================= -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Sách đã trả</h5>

                    <h2 th:text="${soSachDaTra}">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Sách quá hạn</h5>

                    <h2 th:text="${soSachQuaHan}">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5>Sách bị phạt</h5>

                    <h2 th:text="${soSachBiPhat}">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- TIỀN PHẠT -->
    <!-- ============================= -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h5>Tổng tiền phạt</h5>

            <h2>

                <span th:text="${tongTienPhat}">
                    0
                </span>

                VNĐ

            </h2>

        </div>

    </div>

</div>

</body>

</html>
