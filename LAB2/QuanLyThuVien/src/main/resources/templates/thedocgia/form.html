<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${tieuDe}">
        Cấp thẻ độc giả
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="/"
           class="navbar-brand">

            Quản lý thư viện

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0"
                th:text="${tieuDe}">

                Cấp thẻ độc giả

            </h4>

        </div>


        <div class="card-body">

            <!-- Lỗi -->

            <div th:if="${loi}"
                 class="alert alert-danger"
                 th:text="${loi}">

            </div>


            <form th:action="@{/thedocgia/luu}"
                  th:object="${theDocGia}"
                  method="post">


                <!-- Mã thẻ -->

                <div class="mb-3">

                    <label class="form-label">
                        Mã thẻ
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{maThe}"
                           placeholder="Ví dụ: THE02"
                           required>

                </div>


                <!-- Độc giả -->

                <div class="mb-3">

                    <label class="form-label">
                        Độc giả
                    </label>

                    <select class="form-select"
                            name="maDocGia"
                            required>

                        <option value="">
                            -- Chọn độc giả --
                        </option>

                        <option th:each="dg : ${danhSachDocGia}"
                                th:value="${dg.maDocGia}"
                                th:text="${dg.maDocGia + ' - ' + dg.hoTen}"
                                th:selected="${theDocGia.docGia != null and theDocGia.docGia.maDocGia == dg.maDocGia}">

                        </option>

                    </select>

                </div>


                <!-- Ngày cấp -->

                <div class="mb-3">

                    <label class="form-label">
                        Ngày cấp
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{ngayCap}"
                           required>

                </div>


                <!-- Hạn sử dụng -->

                <div class="mb-3">

                    <label class="form-label">
                        Hạn sử dụng
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{hanSuDung}"
                           required>

                </div>


                <!-- Đóng lệ phí -->

                <div class="form-check mb-3">

                    <input type="checkbox"
                           class="form-check-input"
                           th:field="*{daDongLePhi}">

                    <label class="form-check-label">

                        Đã đóng lệ phí

                    </label>

                </div>


                <!-- Trạng thái -->

                <div class="form-check mb-3">

                    <input type="checkbox"
                           class="form-check-input"
                           th:field="*{trangThai}">

                    <label class="form-check-label">

                        Đang hoạt động

                    </label>

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Lưu

                    </button>

                    <a href="/thedocgia"
                       class="btn btn-secondary">

                        Quay lại

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
