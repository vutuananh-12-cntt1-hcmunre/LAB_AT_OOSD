<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${tieuDe}">
        Thêm đầu sách
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            href="/"
            class="navbar-brand">

            HỆ THỐNG QUẢN LÝ THƯ VIỆN

        </a>

    </div>

</nav>


<div class="container mt-4">

    <h2
        class="mb-4"
        th:text="${tieuDe}">

        Thêm đầu sách

    </h2>


    <div
        th:if="${loi}"
        class="alert alert-danger"
        th:text="${loi}">

        Lỗi

    </div>


    <form
        th:action="@{/dausach/luu}"
        th:object="${dauSach}"
        method="post">


        <!-- MÃ ĐẦU SÁCH -->

        <div class="mb-3">

            <label
                for="maDauSach"
                class="form-label">

                Mã đầu sách

            </label>

            <input
                type="text"
                id="maDauSach"
                th:field="*{maDauSach}"
                class="form-control"
                placeholder="Ví dụ: S004"
                required>

        </div>


        <!-- TÊN SÁCH -->

        <div class="mb-3">

            <label
                for="tenSach"
                class="form-label">

                Tên sách

            </label>

            <input
                type="text"
                id="tenSach"
                th:field="*{tenSach}"
                class="form-control"
                placeholder="Nhập tên sách"
                required>

        </div>


        <!-- NĂM XUẤT BẢN -->

        <div class="mb-3">

            <label
                for="namXuatBan"
                class="form-label">

                Năm xuất bản

            </label>

            <input
                type="number"
                id="namXuatBan"
                th:field="*{namXuatBan}"
                class="form-control"
                placeholder="Ví dụ: 2025">

        </div>


        <!-- SỐ LƯỢNG -->

        <div class="mb-3">

            <label
                for="soLuongHienCo"
                class="form-label">

                Số lượng hiện có

            </label>

            <input
                type="number"
                id="soLuongHienCo"
                th:field="*{soLuongHienCo}"
                class="form-control"
                min="0"
                placeholder="Ví dụ: 10"
                required>

        </div>


        <!-- THỂ LOẠI -->

        <div class="mb-3">

            <label
                for="theLoai"
                class="form-label">

                Thể loại

            </label>

            <select
                id="theLoai"
                th:field="*{theLoai}"
                class="form-select"
                required>

                <option
                    value=""
                    disabled>

                    -- Chọn thể loại --

                </option>

                <option
                    th:each="theLoai : ${danhSachTheLoai}"
                    th:value="${theLoai.maTheLoai}"
                    th:text="${theLoai.tenTheLoai}">

                    Công nghệ thông tin

                </option>

            </select>

        </div>


        <!-- NHÀ XUẤT BẢN -->

        <div class="mb-3">

            <label
                for="nhaXuatBan"
                class="form-label">

                Nhà xuất bản

            </label>

            <select
                id="nhaXuatBan"
                th:field="*{nhaXuatBan}"
                class="form-select"
                required>

                <option
                    value=""
                    disabled>

                    -- Chọn nhà xuất bản --

                </option>

                <option
                    th:each="nxb : ${danhSachNhaXuatBan}"
                    th:value="${nxb.maNhaXuatBan}"
                    th:text="${nxb.tenNhaXuatBan}">

                    NXB Giáo Dục

                </option>

            </select>

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="btn btn-primary">

            Lưu

        </button>

        <a
            th:href="@{/dausach}"
            class="btn btn-secondary">

            Hủy

        </a>

    </form>

</div>

</body>

</html>
