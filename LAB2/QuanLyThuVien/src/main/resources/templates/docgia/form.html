<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${tieuDe}">
        Thêm độc giả
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/">
            Quản lý thư viện
        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0"
                th:text="${tieuDe}">
                Thêm độc giả
            </h4>

        </div>


        <div class="card-body">

            <!-- Hiển thị lỗi -->

            <div th:if="${loi}"
                 class="alert alert-danger"
                 th:text="${loi}">
            </div>


            <form th:action="@{/docgia/luu}"
                  th:object="${docGia}"
                  method="post">


                <!-- Mã độc giả -->

                <div class="mb-3">

                    <label class="form-label">
                        Mã độc giả
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{maDocGia}"
                           placeholder="Ví dụ: DG02"
                           required>

                </div>


                <!-- Họ tên -->

                <div class="mb-3">

                    <label class="form-label">
                        Họ tên
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{hoTen}"
                           placeholder="Nhập họ tên"
                           required>

                </div>


                <!-- Ngày sinh -->

                <div class="mb-3">

                    <label class="form-label">
                        Ngày sinh
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{ngaySinh}">

                </div>


                <!-- Địa chỉ -->

                <div class="mb-3">

                    <label class="form-label">
                        Địa chỉ
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{diaChi}"
                           placeholder="Nhập địa chỉ">

                </div>


                <!-- Số điện thoại -->

                <div class="mb-3">

                    <label class="form-label">
                        Số điện thoại
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{soDienThoai}"
                           placeholder="Nhập số điện thoại">

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="Nhập email">

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Lưu
                    </button>

                    <a href="/docgia"
                       class="btn btn-secondary">
                        Quay lại
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
