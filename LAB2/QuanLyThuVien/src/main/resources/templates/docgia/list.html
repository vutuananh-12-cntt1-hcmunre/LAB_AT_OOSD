<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý độc giả</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            Quản lý thư viện
        </a>

        <a class="btn btn-light"
           href="/">
            Trang chủ
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Danh sách độc giả</h2>

        <a class="btn btn-primary"
           href="/docgia/them">
            + Thêm độc giả
        </a>

    </div>

    <!-- Thông báo lỗi -->
    <div th:if="${param.loi}"
         class="alert alert-danger">

        Không thể xóa độc giả này vì độc giả đang được sử dụng
        trong dữ liệu khác.

    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-primary">

            <tr>
                <th>Mã độc giả</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>Email</th>
                <th width="150">Thao tác</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="docGia : ${danhSachDocGia}">

                <td th:text="${docGia.maDocGia}">
                    DG01
                </td>

                <td th:text="${docGia.hoTen}">
                    Nguyễn Văn A
                </td>

                <td th:text="${docGia.ngaySinh}">
                    01/01/2000
                </td>

                <td th:text="${docGia.diaChi}">
                    Đồng Nai
                </td>

                <td th:text="${docGia.soDienThoai}">
                    0900000000
                </td>

                <td th:text="${docGia.email}">
                    abc@gmail.com
                </td>

                <td>

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/docgia/sua/{id}(id=${docGia.maDocGia})}">
                        Sửa
                    </a>

                    <a class="btn btn-sm btn-danger"
                       th:href="@{/docgia/xoa/{id}(id=${docGia.maDocGia})}"
                       onclick="return confirm('Bạn có chắc muốn xóa độc giả này không?');">
                        Xóa
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(danhSachDocGia)}">

                <td colspan="7"
                    class="text-center">
                    Chưa có độc giả nào.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
