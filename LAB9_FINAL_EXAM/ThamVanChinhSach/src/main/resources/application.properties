spring.application.name=ThamVanChinhSach
# Port chạy server backend
server.port=8080

# Cấu hình kết nối SQL Server (Thay đổi thông tin cho khớp với máy bạn)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ThamVanChinhSach;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123

# Chỉ định rõ driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB