<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Phiếu lắp đặt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            width: 500px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Quản lý phiếu lắp đặt</h1>

    <form th:action="@{/lap-dat/them}" th:object="${phieuLapDat}" method="post">

        <label>Số phiếu lắp đặt</label>
        <input type="text"
               th:field="*{soPhieuLapDat}"
               placeholder="Nhập số phiếu">

        <label>Phòng</label>
        <select th:field="*{soPhong}">
            <option value="">-- Chọn phòng --</option>

            <option th:each="phong : ${dsPhong}"
                    th:value="${phong.soPhong}"
                    th:text="${phong.soPhong}">
            </option>
        </select>

        <label>Tiện nghi</label>
        <select th:field="*{maTienNghi}">
            <option value="">-- Chọn tiện nghi --</option>

            <option th:each="tn : ${dsTienNghi}"
                    th:value="${tn.maTienNghi}"
                    th:text="${tn.maTienNghi}">
            </option>
        </select>

        <!-- MÃ NHÂN VIÊN DÙNG DROPDOWN -->
        <label>Nhân viên</label>
        <select th:field="*{maNV}">
            <option value="">-- Chọn nhân viên --</option>

            <option th:each="nv : ${dsNhanVien}"
                    th:value="${nv.maNV}"
                    th:text="${nv.maNV + ' - ' + nv.hoTen}">
            </option>
        </select>

        <label>Ngày lắp đặt</label>
        <input type="date"
               th:field="*{ngayLap}">

        <label>Tình trạng</label>
        <select th:field="*{tinhTrang}">
            <option value="Đang sử dụng">Đang sử dụng</option>
            <option value="Hỏng">Hỏng</option>
            <option value="Đã tháo">Đã tháo</option>
        </select>

        <label>Ghi chú</label>
        <textarea th:field="*{ghiChu}"
                  rows="4"
                  placeholder="Nhập ghi chú"></textarea>

        <button type="submit">Thêm phiếu lắp đặt</button>

    </form>

    <h2>Danh sách phiếu lắp đặt</h2>

    <table>
        <thead>
            <tr>
                <th>Số phiếu</th>
                <th>Phòng</th>
                <th>Tiện nghi</th>
                <th>Ngày lắp đặt</th>
                <th>Tình trạng</th>
                <th>Mã nhân viên</th>
                <th>Ghi chú</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="p : ${dsPhieuLapDat}">

                <td th:text="${p.soPhieuLapDat}"></td>

                <td th:text="${p.soPhong}"></td>

                <td th:text="${p.maTienNghi}"></td>

                <td th:text="${p.ngayLap}"></td>

                <td th:text="${p.tinhTrang}"></td>

                <td th:text="${p.maNV}"></td>

                <td th:text="${p.ghiChu}"></td>

            </tr>

        </tbody>
    </table>

</body>
</html>
