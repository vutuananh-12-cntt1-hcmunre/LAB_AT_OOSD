<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Quản lý dịch vụ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            width: 500px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125aa0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #1976d2;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Quản lý dịch vụ</h1>

    <div class="form-container">

        <h2>Thêm dịch vụ</h2>

        <form th:action="@{/dich-vu/them}"
              th:object="${dichVu}"
              method="post">

            <div class="form-group">
                <label>Mã dịch vụ</label>

                <input type="text"
                       th:field="*{maDV}"
                       required>
            </div>

            <div class="form-group">
                <label>Tên dịch vụ</label>

                <input type="text"
                       th:field="*{tenDV}"
                       required>
            </div>

            <div class="form-group">
                <label>Đơn vị tính</label>

                <input type="text"
                       th:field="*{donViTinh}"
                       required>
            </div>

            <div class="form-group">
                <label>Đơn giá</label>

                <input type="number"
                       th:field="*{donGia}"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <button type="submit">
                Thêm dịch vụ
            </button>

        </form>

    </div>

    <h2>Danh sách dịch vụ</h2>

    <table>

        <thead>
            <tr>
                <th>Mã dịch vụ</th>
                <th>Tên dịch vụ</th>
                <th>Đơn vị tính</th>
                <th>Đơn giá</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="dv : ${dsDichVu}">

                <td th:text="${dv.maDV}"></td>

                <td th:text="${dv.tenDV}"></td>

                <td th:text="${dv.donViTinh}"></td>

                <td th:text="${dv.donGia}"></td>

            </tr>

        </tbody>

    </table>

</body>

</html>
