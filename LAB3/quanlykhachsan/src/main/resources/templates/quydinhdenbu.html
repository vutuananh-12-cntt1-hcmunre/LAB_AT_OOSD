<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Quản lý quy định đền bù</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            width: 600px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125aa0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

    </style>
</head>

<body>

    <h1>Quản lý quy định đền bù</h1>

    <div class="form-container">

        <h2>Thêm quy định</h2>

        <form th:action="@{/quy-dinh-den-bu/them}"
              th:object="${quyDinhDenBu}"
              method="post">

            <div class="form-group">

                <label>Mã quy định</label>

                <input type="text"
                       th:field="*{maQuyDinh}"
                       required>

            </div>

            <div class="form-group">

                <label>Loại tiện nghi</label>

                <select th:field="*{maLoaiTN}"
                        required>

                    <option value="">
                        -- Chọn loại tiện nghi --
                    </option>

                    <option
                        th:each="loai : ${dsLoaiTienNghi}"
                        th:value="${loai.maLoaiTN}"
                        th:text="${loai.maLoaiTN + ' - ' + loai.tenLoaiTN}">
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>Mức độ thiệt hại</label>

                <input type="text"
                       th:field="*{mucDoThietHai}"
                       placeholder="Ví dụ: Hư nhẹ, Hư nặng, Mất"
                       required>

            </div>

            <div class="form-group">

                <label>Mức đền bù</label>

                <input type="number"
                       th:field="*{mucDenBu}"
                       min="0"
                       step="0.01"
                       required>

            </div>

            <button type="submit">
                Thêm quy định
            </button>

        </form>

    </div>

    <h2>Danh sách quy định</h2>

    <table>

        <thead>

            <tr>
                <th>Mã quy định</th>
                <th>Loại tiện nghi</th>
                <th>Mức độ thiệt hại</th>
                <th>Mức đền bù</th>
            </tr>

        </thead>

        <tbody>

            <tr th:each="qd : ${dsQuyDinh}">

                <td th:text="${qd.maQuyDinh}"></td>

                <td th:text="${qd.maLoaiTN}"></td>

                <td th:text="${qd.mucDoThietHai}"></td>

                <td th:text="${qd.mucDenBu}"></td>

            </tr>

        </tbody>

    </table>

</body>

</html>
